name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Testes (núcleo e exportadores)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/make_soft_video.py
          python tests/test_core.py
          python tests/test_exporters.py

      - name: Gerar executáveis (pasta + arquivo único) e zips
        run: python tools/build_exe.py --both --zip

      - name: Auto-teste do .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/Chromaqui/Chromaqui.exe -ArgumentList "--self-test","tests/_out/teste_verde.mp4","selftest_out" -Wait -PassThru
          Get-Content selftest_out/selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Chromaqui-Windows
          path: |
            Chromaqui-Windows.zip
            Chromaqui-Windows-onefile.zip

      - name: Publicar Release (cria ou atualiza, sem duplicar)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe: substituindo os zips (--clobber)."
            gh release upload "$TAG" Chromaqui-Windows.zip Chromaqui-Windows-onefile.zip --clobber
          else
            gh release create "$TAG" Chromaqui-Windows.zip Chromaqui-Windows-onefile.zip \
              --title "Chromaqui! ${TAG#v}" --notes-file CHANGELOG.md --verify-tag
          fi
