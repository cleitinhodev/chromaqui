name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publicar nesta Release existente/tag (ex.: v3.0.1). Vazio = só compilar e testar."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Testes (núcleo e exportadores)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($t in "tests/make_soft_video.py", "tests/test_core.py", "tests/test_exporters.py", "tests/test_ui_flows.py", "tests/test_crop.py", "tests/test_features.py") {
            "::group::$t"
            python -u -X faulthandler $t all
            $rc = $LASTEXITCODE
            "::endgroup::"
            if ($rc -ne 0) { "FALHOU: $t (código $rc)"; exit 1 }
          }

      - name: Gerar executáveis (pasta + arquivo único) e zips
        run: python tools/build_exe.py --both --zip

      - name: Auto-teste do .exe
        shell: pwsh
        run: |
          $out = Join-Path $PWD "selftest_out"
          $vid = Join-Path $PWD "tests/_out/teste_verde.mp4"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath (Resolve-Path dist/Chromaqui/Chromaqui.exe) -ArgumentList "--self-test","`"$vid`"","`"$out`"" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          Get-ChildItem $out | Format-Table Name, Length
          foreach ($f in "selftest.log", "selftest_crash.log") {
            $fp = Join-Path $out $f
            if (Test-Path $fp) { "== $f =="; Get-Content $fp }
          }
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest_out
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Chromaqui-Windows
          path: |
            Chromaqui-Windows.zip
            Chromaqui-Windows-onefile.zip

      - name: Publicar Release (cria ou atualiza, sem duplicar)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python tools/release_notes.py "${TAG#v}" > release_notes.md
          # versões de testes (-alpha/-beta/-rc) saem como pré-release e NUNCA viram a "Latest";
          # a estável continua sendo a última versão sem sufixo
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) KIND=(--prerelease --latest=false); echo "$TAG: pré-release (de testes)";;
            *) KIND=(--latest); echo "$TAG: versão estável (Latest)";;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe: substituindo os zips (--clobber)."
            gh release upload "$TAG" Chromaqui-Windows.zip Chromaqui-Windows-onefile.zip --clobber
            gh release edit "$TAG" "${KIND[@]}"
          else
            gh release create "$TAG" Chromaqui-Windows.zip Chromaqui-Windows-onefile.zip \
              --title "Chromaqui! ${TAG#v}" --notes-file release_notes.md --verify-tag "${KIND[@]}"
          fi
